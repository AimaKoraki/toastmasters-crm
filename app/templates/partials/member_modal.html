<!-- Standalone Add Member Modal (Loaded via HTMX into #modal-container) -->
<div id="add-member-modal-standalone" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="bg-white p-6 rounded-[16px] w-full max-w-md shadow-2xl border border-slate-100 transform transition-all">
        <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-100">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-900">Add Club Member</h3>
            </div>
            <button type="button" onclick="document.getElementById('add-member-modal-standalone').remove()" class="text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <form hx-post="/members" hx-target="#main-content">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Full Name *</label>
                    <input type="text" name="full_name" required placeholder="e.g. Kasun Fernando"
                           class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address *</label>
                    <input type="email" name="email" required placeholder="e.g. kasun.f@example.com"
                           class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Phone / WhatsApp</label>
                    <input type="text" name="phone" placeholder="e.g. +94 77 123 4567"
                           class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Status</label>
                        <select name="status" class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                            {% for s in statuses %}
                            <option value="{{ s }}" {% if s == 'Active' %}selected{% endif %}>{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Pathways Level</label>
                        <select name="pathway_level" class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                            {% for p in pathway_levels %}
                            <option value="{{ p }}" {% if p == 'Level 1' %}selected{% endif %}>{{ p }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-6 pt-4 border-t border-slate-100">
                <button type="button" onclick="document.getElementById('add-member-modal-standalone').remove()"
                        class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancel</button>
                <button type="submit" class="btn-primary">
                    <i data-lucide="check" class="w-4 h-4"></i> Save Member
                </button>
            </div>
        </form>
    </div>
</div>
