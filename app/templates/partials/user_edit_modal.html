<div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-lg overflow-hidden animate-in fade-in zoom-in-95 duration-200 my-8">
        
        <!-- Modal Header -->
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
                    <i data-lucide="pencil" class="w-4 h-4"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-900 text-base">Edit User Account</h3>
                    <p class="text-xs text-slate-500 font-mono">@{{ target_user.username }}</p>
                </div>
            </div>
            <button 
                type="button" 
                onclick="document.getElementById('modal-backdrop').remove()" 
                class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100 transition"
            >
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Inline Error Banner (HTMX Guard) -->
        {% if error %}
        <div class="mx-6 mt-4 p-3 rounded-lg bg-rose-50 border border-rose-200 flex items-start gap-2.5 text-xs text-rose-700">
            <i data-lucide="alert-circle" class="w-4 h-4 text-rose-500 shrink-0 mt-0.5"></i>
            <div>
                <span class="font-semibold">Action Prevented:</span>
                <span>{{ error }}</span>
            </div>
        </div>
        {% endif %}

        <!-- Form -->
        <form 
            hx-post="/users/{{ target_user.id }}" 
            hx-target="#main-content" 
            hx-swap="innerHTML"
            class="p-6 space-y-4"
        >
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Full Name -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name <span class="text-rose-500">*</span></label>
                    <input 
                        type="text" 
                        name="full_name" 
                        value="{{ target_user.full_name }}"
                        required 
                        class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                    >
                </div>

                <!-- Username (Read-Only) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
                    <input 
                        type="text" 
                        value="{{ target_user.username }}"
                        disabled 
                        class="w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-lg text-xs text-slate-500 font-mono cursor-not-allowed"
                    >
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Email -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address <span class="text-rose-500">*</span></label>
                    <input 
                        type="email" 
                        name="email" 
                        value="{{ target_user.email }}"
                        required 
                        class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                    >
                </div>

                <!-- Role -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Account Role <span class="text-rose-500">*</span></label>
                    <select 
                        name="role" 
                        required
                        class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                    >
                        <option value="Exco" {% if target_user.role == 'Exco' %}selected{% endif %}>Exco Officer (Standard Operations)</option>
                        <option value="Admin" {% if target_user.role == 'Admin' %}selected{% endif %}>Administrator (Full System Access)</option>
                        <option value="Viewer" {% if target_user.role == 'Viewer' %}selected{% endif %}>Viewer (Read-Only Access)</option>
                    </select>
                </div>
            </div>

            <!-- Optional 1-to-1 Member Link -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">
                    Link to Club Member (1-to-1)
                    <span class="text-slate-400 font-normal ml-1">Optional</span>
                </label>
                <select 
                    name="member_id" 
                    class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                >
                    <option value="">-- None (Standalone Account) --</option>
                    {% for m in available_members %}
                    <option value="{{ m.id }}" {% if target_user.member_id == m.id %}selected{% endif %}>
                        {{ m.full_name }} ({{ m.email }})
                    </option>
                    {% endfor %}
                </select>
                <p class="text-[11px] text-slate-400 mt-1">Links this login to their personal profile in the club membership roster.</p>
            </div>

            <div class="space-y-2 pt-2 border-t border-slate-100">
                <div class="flex items-center gap-2">
                    <input 
                        type="checkbox" 
                        id="is_active" 
                        name="is_active" 
                        value="true" 
                        {% if target_user.is_active %}checked{% endif %}
                        {% if current_user and current_user.id == target_user.id %}disabled title="You cannot deactivate your own account"{% endif %}
                        class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 h-4 w-4"
                    >
                    <label for="is_active" class="text-xs font-medium text-slate-700">Account Active</label>
                    {% if current_user and current_user.id == target_user.id %}
                    <span class="text-[10px] text-slate-400 italic">(Self-deactivation prevented)</span>
                    <!-- Hidden field to preserve active state when disabled -->
                    <input type="hidden" name="is_active" value="true">
                    {% endif %}
                </div>

                <div class="flex items-center gap-2">
                    <input 
                        type="checkbox" 
                        id="must_change_password" 
                        name="must_change_password" 
                        value="true" 
                        {% if target_user.must_change_password %}checked{% endif %}
                        class="rounded border-slate-300 text-amber-600 focus:ring-amber-500 h-4 w-4"
                    >
                    <label for="must_change_password" class="text-xs font-medium text-slate-700">Force password change on next login</label>
                </div>
            </div>

            <!-- Footer Actions -->
            <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                <button 
                    type="button" 
                    onclick="document.getElementById('modal-backdrop').remove()" 
                    class="px-4 py-2 text-xs font-semibold text-slate-600 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition"
                >
                    Cancel
                </button>
                <button 
                    type="submit" 
                    class="btn-primary px-4 py-2 text-xs font-semibold rounded-lg shadow-xs hover:shadow transition flex items-center gap-1.5"
                >
                    <i data-lucide="check" class="w-4 h-4"></i>
                    Update User
                </button>
            </div>
        </form>
    </div>
</div>
