<div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md overflow-hidden animate-in fade-in zoom-in-95 duration-200 my-8">
        
        <!-- Modal Header -->
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center">
                    <i data-lucide="key" class="w-4 h-4"></i>
                </div>
                <div>
                    <h3 class="font-bold text-slate-900 text-base">Reset User Password</h3>
                    <p class="text-xs text-slate-500 font-mono">@{{ target_user.username }}</p>
                </div>
            </div>
            <button 
                type="button" 
                onclick="document.getElementById('modal-backdrop').remove()" 
                class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-100 transition"
            >
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Inline Error Banner (HTMX Guard) -->
        {% if error %}
        <div class="mx-6 mt-4 p-3 rounded-lg bg-rose-50 border border-rose-200 flex items-start gap-2.5 text-xs text-rose-700">
            <i data-lucide="alert-circle" class="w-4 h-4 text-rose-500 shrink-0 mt-0.5"></i>
            <div>
                <span class="font-semibold">Reset Failed:</span>
                <span>{{ error }}</span>
            </div>
        </div>
        {% endif %}

        <!-- Form -->
        <form 
            hx-post="/users/{{ target_user.id }}/reset-password" 
            hx-target="#main-content" 
            hx-swap="innerHTML"
            class="p-6 space-y-4"
        >
            <div class="p-3 bg-amber-50/70 border border-amber-200 rounded-lg text-xs text-amber-800 flex items-start gap-2">
                <i data-lucide="info" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
                <div>
                    You are setting a new administrative password for <strong>{{ target_user.full_name }}</strong>. They will need this password to log in.
                </div>
            </div>

            <!-- New Password -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">New Password <span class="text-rose-500">*</span></label>
                <input 
                    type="password" 
                    name="new_password" 
                    required 
                    placeholder="Min. 8 characters, letters &amp; numbers"
                    class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                >
            </div>

            <!-- Confirm Password -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Confirm New Password <span class="text-rose-500">*</span></label>
                <input 
                    type="password" 
                    name="confirm_password" 
                    required 
                    placeholder="Re-enter new password"
                    class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"
                >
            </div>

            <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
                <input 
                    type="checkbox" 
                    id="must_change_password" 
                    name="must_change_password" 
                    value="true" 
                    checked
                    class="rounded border-slate-300 text-amber-600 focus:ring-amber-500 h-4 w-4"
                >
                <label for="must_change_password" class="text-xs font-medium text-slate-700">Require user to change password on their next login</label>
            </div>

            <!-- Footer Actions -->
            <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                <button 
                    type="button" 
                    onclick="document.getElementById('modal-backdrop').remove()" 
                    class="px-4 py-2 text-xs font-semibold text-slate-600 hover:text-slate-800 hover:bg-slate-100 rounded-lg transition"
                >
                    Cancel
                </button>
                <button 
                    type="submit" 
                    class="btn-primary bg-amber-600 hover:bg-amber-700 px-4 py-2 text-xs font-semibold rounded-lg shadow-xs hover:shadow transition flex items-center gap-1.5 text-white"
                >
                    <i data-lucide="key" class="w-4 h-4"></i>
                    Update Password
                </button>
            </div>
        </form>
    </div>
</div>
