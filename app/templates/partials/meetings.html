<div class="card card-hover overflow-hidden">
    <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
        <h3 class="text-[20px] font-semibold text-gray-900">Meetings & Attendance</h3>
        <button onclick="document.getElementById('add-meeting-modal').classList.remove('hidden')" 
                class="bg-[#772432] hover:bg-[#5c1c27] text-white font-medium shadow-sm transition-colors px-4 py-2 rounded-[12px]">
            + New Meeting
        </button>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-600">
            <thead class="bg-slate-50/80 text-[13px] font-semibold uppercase tracking-[0.08em] text-gray-500 border-b border-slate-200">
                <tr>
                    <th class="px-6 py-3">Meeting #</th>
                    <th class="px-6 py-3">Date</th>
                    <th class="px-6 py-3">Theme</th>
                    <th class="px-6 py-3 text-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                {% for m in meetings %}
                <tr class="hover:bg-slate-50/60 transition-colors">
                    <td class="px-6 py-4 font-semibold text-[#004165]">#{{ m.meeting_number }}</td>
                    <td class="px-6 py-4 text-slate-600 text-sm font-mono">{{ m.meeting_date }}</td>
                    <td class="px-6 py-4 text-slate-600 text-sm italic">{{ m.theme }}</td>
                    <td class="px-6 py-4 text-right">
                        <button class="text-[#772432] hover:underline text-sm font-semibold transition-colors">Mark Attendance</button>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="py-12 text-center">
                        <div class="flex flex-col items-center justify-center space-y-3">
                            <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-2xl shadow-inner">
                                📅
                            </div>
                            <h4 class="text-[18px] font-semibold text-gray-900">No meetings yet</h4>
                            <p class="text-[14px] text-gray-500 max-w-sm">
                                Create a new meeting to start tracking attendance and role assignments.
                            </p>
                            <button class="btn-primary mt-2" onclick="document.getElementById('add-meeting-modal').classList.remove('hidden')">
                                ＋ New Meeting
                            </button>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Add Meeting Modal -->
<div id="add-meeting-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-[12px] w-96 shadow-xl">
        <h3 class="text-lg font-bold text-[#004165] mb-4">Create New Meeting</h3>
        <form hx-post="/meetings" hx-target="#main-content" onsubmit="document.getElementById('add-meeting-modal').classList.add('hidden')">
            <div class="mb-3">
                <label class="block text-sm text-slate-500 mb-1">Meeting Number</label>
                <input type="number" name="meeting_number" required class="w-full border border-slate-300 rounded-[8px] px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#004165]">
            </div>
            <div class="mb-3">
                <label class="block text-sm text-slate-500 mb-1">Date</label>
                <input type="date" name="meeting_date" required class="w-full border border-slate-300 rounded-[8px] px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#004165]">
            </div>
            <div class="mb-4">
                <label class="block text-sm text-slate-500 mb-1">Theme (Optional)</label>
                <input type="text" name="theme" class="w-full border border-slate-300 rounded-[8px] px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#004165]">
            </div>
            <div class="flex justify-end space-x-2">
                <button type="button" onclick="document.getElementById('add-meeting-modal').classList.add('hidden')" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-100 rounded-[8px] transition-colors">Cancel</button>
                <button type="submit" class="bg-[#772432] hover:bg-[#5c1c27] text-white font-medium shadow-sm transition-colors px-4 py-2 rounded-[8px]">Save Meeting</button>
            </div>
        </form>
    </div>
</div>
