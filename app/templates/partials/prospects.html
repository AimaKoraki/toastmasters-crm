<div class="bg-ui-surface border border-ui-border rounded-lg shadow-sm">
    <div class="p-4 border-b border-ui-border flex justify-between items-center">
        <h3 class="text-lg font-semibold text-tm-blue">Guests & Prospects Pipeline</h3>
        <button onclick="document.getElementById('add-prospect-modal').classList.remove('hidden')" 
                class="bg-tm-maroon text-white px-4 py-2 rounded text-sm font-semibold hover:bg-ui-accentHover transition">
            + New Guest
        </button>
    </div>
    <div class="p-0">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-ui-bgSubtle border-b border-ui-border text-sm text-ui-textMuted uppercase">
                    <th class="px-4 py-3 font-medium">Name</th>
                    <th class="px-4 py-3 font-medium">Email</th>
                    <th class="px-4 py-3 font-medium">Phone</th>
                    <th class="px-4 py-3 font-medium">Joined</th>
                </tr>
            </thead>
            <tbody>
                {% for p in prospects %}
                <tr class="border-b border-ui-border hover:bg-ui-bgSubtle transition">
                    <td class="px-4 py-3">{{ p.full_name }}</td>
                    <td class="px-4 py-3">{{ p.email }}</td>
                    <td class="px-4 py-3">{{ p.phone }}</td>
                    <td class="px-4 py-3">{{ p.created_at[:10] }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="px-4 py-8 text-center text-ui-textMuted">No prospects found. Add a new guest to get started.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Add Prospect Modal -->
<div id="add-prospect-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-ui-surface p-6 rounded-lg w-96 shadow-xl">
        <h3 class="text-lg font-bold text-tm-blue mb-4">Log New Guest</h3>
        <form hx-post="/prospects" hx-target="#main-content" onsubmit="document.getElementById('add-prospect-modal').classList.add('hidden')">
            <div class="mb-3">
                <label class="block text-sm text-ui-textMuted mb-1">Full Name</label>
                <input type="text" name="full_name" required class="w-full border border-ui-border rounded px-3 py-2">
            </div>
            <div class="mb-3">
                <label class="block text-sm text-ui-textMuted mb-1">Email</label>
                <input type="email" name="email" required class="w-full border border-ui-border rounded px-3 py-2">
            </div>
            <div class="mb-4">
                <label class="block text-sm text-ui-textMuted mb-1">Phone</label>
                <input type="text" name="phone" class="w-full border border-ui-border rounded px-3 py-2">
            </div>
            <div class="flex justify-end space-x-2">
                <button type="button" onclick="document.getElementById('add-prospect-modal').classList.add('hidden')" class="px-4 py-2 text-sm text-ui-textMuted hover:bg-ui-bgSubtle rounded">Cancel</button>
                <button type="submit" class="px-4 py-2 text-sm bg-tm-blue text-white rounded hover:bg-ui-primaryHover">Save Guest</button>
            </div>
        </form>
    </div>
</div>
