<div class="card card-hover overflow-hidden">
    <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
        <h3 class="text-[20px] font-semibold text-gray-900">Member Role History Matrix</h3>
        <button onclick="document.getElementById('assign-role-modal').classList.remove('hidden')" 
                class="bg-[#772432] hover:bg-[#5c1c27] text-white font-medium shadow-sm transition-colors px-4 py-2 rounded-[12px]">
            Assign Role
        </button>
    </div>
    <div class="overflow-x-auto">
        <!-- A real implementation would dynamically generate columns for roles -->
        <table class="w-full text-left text-sm text-gray-600">
            <thead class="bg-slate-50/80 text-[13px] font-semibold uppercase tracking-[0.08em] text-gray-500 border-b border-slate-200">
                <tr>
                    <th class="px-6 py-3">Member</th>
                    <th class="px-6 py-3 text-center">TMOD</th>
                    <th class="px-6 py-3 text-center">Speaker</th>
                    <th class="px-6 py-3 text-center">Evaluator</th>
                    <th class="px-6 py-3 text-center">GE</th>
                    <th class="px-6 py-3 text-center">TTM</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                {% for row in matrix %}
                <!-- Matrix rows would go here -->
                {% else %}
                <tr>
                    <td colspan="6" class="py-12 text-center">
                        <div class="flex flex-col items-center justify-center space-y-3">
                            <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-2xl shadow-inner">
                                🎭
                            </div>
                            <h4 class="text-[18px] font-semibold text-gray-900">No role history found</h4>
                            <p class="text-[14px] text-gray-500 max-w-sm">
                                Assign meeting roles to members to track their progress.
                            </p>
                            <button class="btn-primary mt-2" onclick="document.getElementById('assign-role-modal').classList.remove('hidden')">
                                Assign Role
                            </button>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Assign Role Modal -->
<div id="assign-role-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-[12px] w-96 shadow-xl">
        <h3 class="text-lg font-bold text-[#004165] mb-4">Assign Role</h3>
        <form hx-post="/roles/assign" hx-target="#main-content" onsubmit="document.getElementById('assign-role-modal').classList.add('hidden')">
            <div class="mb-3">
                <label class="block text-sm text-slate-500 mb-1">Meeting ID</label>
                <input type="number" name="meeting_id" required class="w-full border border-slate-300 rounded-[8px] px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#004165]">
            </div>
            <div class="mb-3">
                <label class="block text-sm text-slate-500 mb-1">Member ID</label>
                <input type="number" name="member_id" required class="w-full border border-slate-300 rounded-[8px] px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#004165]">
            </div>
            <div class="mb-3">
                <label class="block text-sm text-slate-500 mb-1">Role ID</label>
                <input type="number" name="role_id" required class="w-full border border-slate-300 rounded-[8px] px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#004165]">
            </div>
            <div class="mb-4">
                <label class="block text-sm text-slate-500 mb-1">Speech Title (Optional)</label>
                <input type="text" name="speech_title" class="w-full border border-slate-300 rounded-[8px] px-3 py-2 focus:outline-none focus:ring-1 focus:ring-[#004165]">
            </div>
            <div class="flex justify-end space-x-2">
                <button type="button" onclick="document.getElementById('assign-role-modal').classList.add('hidden')" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-100 rounded-[8px] transition-colors">Cancel</button>
                <button type="submit" class="bg-[#772432] hover:bg-[#5c1c27] text-white font-medium shadow-sm transition-colors px-4 py-2 rounded-[8px]">Assign</button>
            </div>
        </form>
    </div>
</div>
