<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Toastmasters CRM{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tm: {
                            blue: 'var(--tm-blue)',
                            maroon: 'var(--tm-maroon)',
                            gray: 'var(--tm-gray)',
                            yellow: 'var(--tm-yellow)',
                        },
                        ui: {
                            primary: 'var(--ui-primary)',
                            primaryHover: 'var(--ui-primary-hover)',
                            accent: 'var(--ui-accent)',
                            accentHover: 'var(--ui-accent-hover)',
                            surface: 'var(--ui-surface)',
                            bgSubtle: 'var(--ui-bg-subtle)',
                            border: 'var(--ui-border)',
                            textMain: 'var(--ui-text-main)',
                            textMuted: 'var(--ui-text-muted)',
                            warningBg: 'var(--ui-warning-bg)',
                            warningText: 'var(--ui-warning-text)',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-ui-bgSubtle text-ui-textMain min-h-screen">
    {% block content %}
    {% endblock %}
</body>
</html>
